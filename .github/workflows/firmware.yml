name: Firmware checks
on:
  push:
    branches: ['**']
    paths: ['firmware/**', 'tools/mi-360/**', 'tools/reolink-e1-zoom/**', 'tools/ds-kd8003-ime1/**', 'Makefile', '.github/workflows/**']
  pull_request:
    paths: ['firmware/**', 'tools/mi-360/**', 'tools/reolink-e1-zoom/**', 'tools/ds-kd8003-ime1/**', 'Makefile', '.github/workflows/**']
permissions:
  contents: read
env:
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host compiler and Rust
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y clang llvm lld
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --component rust-src
          rustup default 1.95.0
          rustup target add --toolchain 1.95.0 armv7-unknown-linux-gnueabihf
      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            firmware/.tools/zig
            firmware/.tools/opus-*
          key: pinned-tools-${{ runner.os }}-${{ hashFiles('firmware/toolchain.json', 'firmware/opus.json') }}
      - name: Pinned cross compiler
        run: |
          python3 firmware/scripts/fetch-zig.py
          python3 firmware/scripts/fetch-opus.py
          echo "$GITHUB_WORKSPACE/firmware/.tools/zig" >> "$GITHUB_PATH"
      - name: Host gate
        run: make gate
      - name: Native builds without vendor SDK inputs
        run: make -C firmware build-mi360 build-reolink build-ds-kd8003-ime1
