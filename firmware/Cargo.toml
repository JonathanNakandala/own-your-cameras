[workspace]
members = ["cameras/ds-kd8003-ime1", "crates/camera-control", "crates/camera-onvif", "crates/keypad-protocol", "crates/camera-opus", "crates/camera-transport", "cameras/mi360", "cameras/reolink-e1-zoom/cam", "cameras/reolink-e1-zoom/hdal", "cameras/reolink-e1-zoom/hdal-sys"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
